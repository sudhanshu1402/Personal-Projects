name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [ javascript, go ]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      if: matrix.language == 'javascript'
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Syntax-check JS Projects
      if: matrix.language == 'javascript'
      run: |
        find javascript nodejs -name '*.js' -not -path '*/node_modules/*' -print0 \
          | xargs -0 -n1 node --check
        node --check projects_data.js

    - name: Check the vault page against the data
      if: matrix.language == 'javascript'
      run: node scripts/check-vault.mjs

    - name: Redraw the README images from the tracked file list
      if: matrix.language == 'javascript'
      run: |
        node scripts/make-readme-svg.mjs
        git add -A -N assets/
        git diff --exit-code -- assets

    - name: Set up Go
      if: matrix.language == 'go'
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'
        
    - name: Build Go Projects
      if: matrix.language == 'go'
      run: |
        cd go/hard/load-balancer
        go build -v ./...
